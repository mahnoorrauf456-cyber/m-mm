
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Until We Meet Again ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(
        135deg,
        #e8c9ff,
        #f9c9e8,
        #d9c5ff,
        #f6d5ee
    );
    background-size: 400% 400%;
    animation: gradient 12s ease infinite;
    color: #633c70;
    text-align: center;
}

@keyframes gradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.container {
    width: 90%;
    max-width: 650px;
    padding: 45px 25px;
    border-radius: 30px;
    background: rgba(255,255,255,0.38);
    backdrop-filter: blur(15px);
    box-shadow: 0 10px 45px rgba(115,65,130,0.18);
    border: 1px solid rgba(255,255,255,0.65);
    animation: appear 2s ease;
    z-index: 2;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.heart {
    font-size: 55px;
    animation: heartbeat 1.5s infinite;
    margin-bottom: 15px;
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
}

h1 {
    font-size: clamp(30px, 6vw, 43px);
    color: #873d83;
    margin-bottom: 15px;
}

.timer {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin: 30px 0;
}

.time-box {
    padding: 20px 5px;
    border-radius: 18px;
    background: rgba(255,255,255,0.65);
    box-shadow: 0 5px 15px rgba(110,60,120,0.10);
}

.time-box span {
    display: block;
    font-size: clamp(25px, 5vw, 38px);
    font-weight: bold;
    color: #9b4c9a;
}

.time-box small {
    font-size: 12px;
    letter-spacing: 1px;
    color: #805b87;
}

.message {
    font-size: 19px;
    line-height: 1.8;
    margin-top: 25px;
    color: #754579;
    font-style: italic;
}

.footer {
    margin-top: 25px;
    font-size: 15px;
    color: #875c8e;
}

.floating-heart {
    position: absolute;
    bottom: -30px;
    color: rgba(255,255,255,0.8);
    font-size: 25px;
    animation: float 9s linear infinite;
    pointer-events: none;
}

@keyframes float {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }
    20% { opacity: 1; }
    100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

@media(max-width: 450px) {
    .container {
        padding: 35px 15px;
    }

    .timer {
        gap: 7px;
    }

    .time-box {
        padding: 15px 3px;
    }

    .time-box small {
        font-size: 10px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="heart">❤️</div>

    <h1>Until We Meet Again</h1>

    <div class="timer">

        <div class="time-box">
            <span id="days">00</span>
            <small>DAYS</small>
        </div>

        <div class="time-box">
            <span id="hours">00</span>
            <small>HOURS</small>
        </div>

        <div class="time-box">
            <span id="minutes">00</span>
            <small>MINUTES</small>
        </div>

        <div class="time-box">
            <span id="seconds">00</span>
            <small>SECONDS</small>
        </div>

    </div>

    <div class="message">
        "No matter how far apart we are,
        my heart is always with you.
        Counting every moment until I see you again." ❤️
    </div>

    <div class="footer">
        Until then, you're always in my heart. 💗
    </div>

</div>

<script>

// Starting date: 29 October 2026, 7:58 PM Pakistan Time
const startDate = new Date("2026-10-29T19:58:00+05:00");

function updateTimer() {

    const now = new Date();
    let difference = now - startDate;

    if (difference < 0) {
        document.getElementById("days").textContent = "00";
        document.getElementById("hours").textContent = "00";
        document.getElementById("minutes").textContent = "00";
        document.getElementById("seconds").textContent = "00";
        return;
    }

    const days = Math.floor(difference / (1000 * 60 * 60 * 24));
    const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((difference / (1000 * 60)) % 60);
    const seconds = Math.floor((difference / 1000) % 60);

    document.getElementById("days").textContent =
        String(days).padStart(2, "0");

    document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");

    document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");

    document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");
}

setInterval(updateTimer, 1000);
updateTimer();

// Floating hearts animation
function createHeart() {

    const heart = document.createElement("div");

    heart.className = "floating-heart";

    heart.innerHTML = ["❤️", "💗", "💕", "💜", "🫂"][
        Math.floor(Math.random() * 5)
    ];

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration =
        (6 + Math.random() * 6) + "s";

    heart.style.fontSize =
        (15 + Math.random() * 25) + "px";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 12000);
}

setInterval(createHeart, 600);

</script>

</body>
</html>
